spring.application.name=ajwa-web
# Listen on all interfaces so phones on the shop Wi-Fi can open http://<this-pc-ip>:8110
server.port=${PORT:8110}

spring.datasource.url=jdbc:mysql://${DB_HOST:149.20.188.83}:${DB_PORT:3306}/${DB_NAME:ajwa_inventory}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=${DB_USER:basir}
spring.datasource.password=${DB_PASSWORD:${db.password:}}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=10MB

# Secrets (DB password, relay endpoint/token) live in the git-ignored secrets.properties next to this
# file and are packed into the jar; copy secrets.properties.example to create it.
# Backup relay endpoint/token (the same values the APK uses). Read from relay.properties, which is
# git-ignored: either next to the jar (deployment) or in android/ (running from web/server).
spring.config.import=optional:classpath:secrets.properties,optional:file:./relay.properties,optional:file:../../android/relay.properties
ajwa.relay.endpoint=${endpoint:${relay.endpoint:}}
ajwa.relay.token=${token:${relay.token:}}

ajwa.shop-name=Ajwa Sanitary
ajwa.provider-phone=01818285008
ajwa.provider-whatsapp=8801818285008
